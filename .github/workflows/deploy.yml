name: Deploy to S3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      BUCKET: spencerkarofsky-website
      CF_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload static assets
        run: >
          aws s3 sync out/_next/static s3://$BUCKET/_next/static
          --cache-control "public,max-age=31536000,immutable"

      - name: Upload pages and files
        run: >
          aws s3 sync out/ s3://$BUCKET
          --delete
          --exclude "_next/static/*"
          --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront
        if: env.CF_ID != ''
        run: aws cloudfront create-invalidation --distribution-id "$CF_ID" --paths "/*"
